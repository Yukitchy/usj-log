<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パークログ USJ — 待ち時間 × その日の記録</title>
<meta name="theme-color" content="#0E141C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E141C;          /* 地：夜の藍 */
  --bg2:#151E29;
  --card:#1A2533;
  --line:#27384B;
  --ink:#EAF1F8;
  --sub:#8FA4BB;
  --accent:#2E86FF;      /* 主役：地図の青 */
  --sky:#4FB0FF;
  /* 意味の色（アクセントとは別に持つ） */
  --ok:#3FBF6F;
  --warn:#F5B942;
  --bad:#F0554E;
  --gold:#FFC24B;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body,p,li,td,th,div,span,b,small,summary,button,a,h1,h2,h3,h4{
  word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere;
}
h1,h2,h3,h4,.btn,.chip,.pill,.tag,.eyebrow,.note,.hint{text-wrap:balance}
p{text-wrap:pretty}
body{
  background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c",-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.75;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.num{font-variant-numeric:tabular-nums}
.dsp{font-family:"Lilita One",sans-serif;font-weight:400;letter-spacing:.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* ── ヘッダー ── */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(14,20,28,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 0}
.logo{display:flex;align-items:baseline;gap:7px;flex:1;min-width:0}
.logo b{font-size:17px;font-weight:900;letter-spacing:.02em}
.logo span{font-size:10px;color:var(--sub);letter-spacing:.14em;font-weight:800}
.rf{
  border:1px solid var(--line);background:var(--bg2);color:var(--sub);
  border-radius:999px;padding:6px 13px;font:inherit;font-size:12px;font-weight:800;
  cursor:pointer;white-space:nowrap;
  transition:transform .12s var(--spring),border-color .12s ease,color .12s ease;
}
.rf:hover{transform:translateY(-1px);border-color:var(--sky);color:var(--sky)}
.rf:active{transform:translateY(0) scale(.97)}
.rf[data-busy="1"]{opacity:.5;pointer-events:none}

/* ── 混雑スコア ── */
.crowd{
  display:flex;align-items:center;gap:16px;
  background:linear-gradient(160deg,var(--bg2),var(--card));
  border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0 12px;
  position:relative;overflow:hidden;
  animation:in .6s var(--ease-out) both;
}
.crowd::before{
  content:"";position:absolute;top:-90px;right:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(46,134,255,.20),transparent 70%);pointer-events:none;
}
.crowd .big{font-size:52px;line-height:.9;letter-spacing:-.01em}
.crowd .u{font-size:15px;color:var(--sub);margin-left:3px}
.crowd .meta{flex:1;min-width:0}
.crowd .lv{font-size:19px;font-weight:900;line-height:1.3}
.crowd .sub{font-size:11.5px;color:var(--sub);line-height:1.6}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ── 地図 ── */
.mapcard{
  background:var(--bg2);border:1px solid var(--line);border-radius:20px;
  padding:8px;position:relative;overflow:hidden;
  animation:in .6s .06s var(--ease-out) both;
}
.mapbox{position:relative}
svg.map{display:block;width:100%;height:auto;border-radius:14px;background:#EDE3CE;
  touch-action:none;cursor:grab;overflow:hidden}
svg.map:active{cursor:grabbing}
.zc{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:5px}
.zc button{
  width:34px;height:34px;border-radius:11px;border:1px solid rgba(43,33,24,.16);
  background:rgba(255,252,246,.94);color:#3B3226;font:inherit;font-size:16px;font-weight:900;
  cursor:pointer;box-shadow:0 2px 6px rgba(60,45,25,.18);
  transition:transform .12s var(--spring),background .12s ease;
}
.zc button:hover{transform:translateY(-1px);background:#fff}
.zc button:active{transform:scale(.93)}
.zone-l{font-size:10px;font-weight:800;fill:#5A4C36;letter-spacing:.02em;paint-order:stroke;
  stroke:rgba(255,251,242,.75);stroke-width:3px}
.lagoon-l{font-size:10px;font-weight:800;fill:#3F7F9C;letter-spacing:.06em}
.pin{cursor:pointer}
.pin circle{transition:r .14s var(--ease-out)}
.pin:hover circle.dot{r:19}
.pin text{font-size:12px;font-weight:900;fill:#1B1206;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-variant-numeric:tabular-nums}
.pin circle.dot{stroke:rgba(255,255,255,.92);stroke-width:2}
.pin.done circle.dot{stroke:#2B2118;stroke-width:3}
.pin .nm{font-size:9px;fill:#463B2B;font-weight:800;dominant-baseline:auto;paint-order:stroke;
  stroke:rgba(255,251,242,.85);stroke-width:3px}
.route{fill:none;stroke:#1F6FEB;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:8 6;opacity:.95}

/* 先輩のテーマ */
.honey{
  border:1px solid var(--line);background:var(--bg2);border-radius:999px;
  width:34px;height:34px;font-size:16px;cursor:pointer;line-height:1;
  transition:transform .12s var(--spring),border-color .12s ease;
}
.honey:hover{transform:translateY(-1px) rotate(-8deg);border-color:var(--gold)}
.honey:active{transform:scale(.9)}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(6,10,15,.66);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{
  background:var(--card);border:1px solid var(--line);border-bottom:0;
  border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;animation:up .32s var(--ease-out) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-in h3{font-size:16px;font-weight:900}
.sheet-in p{font-size:12px;color:var(--sub);margin:3px 0 16px;font-weight:700}
.sheet-in a{
  display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);
  background:var(--bg2);border:1px solid var(--line);border-radius:13px;
  padding:12px 15px;margin-bottom:8px;font-size:13.5px;font-weight:800;
  transition:transform .14s var(--ease-out),border-color .14s ease}
.sheet-in a:hover{transform:translateY(-2px);border-color:var(--sky)}
.sheet-in a i{font-style:normal;font-size:17px}
.legend{display:flex;gap:12px;justify-content:center;padding:9px 4px 3px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legend span{font-size:10.5px;color:var(--sub);font-weight:800}

/* ── タブ ── */
.tabs{display:flex;gap:6px;margin:16px 0 10px;background:var(--bg2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.tab{
  flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:13px;font-weight:800;
  padding:9px 4px;border-radius:10px;cursor:pointer;transition:background .16s ease,color .16s ease;
}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}

/* ── リスト ── */
.sortbar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.chip{
  border:1px solid var(--line);background:var(--bg2);color:var(--sub);
  border-radius:999px;padding:5px 12px;font:inherit;font-size:11.5px;font-weight:800;
  cursor:pointer;white-space:nowrap;transition:all .14s ease;
}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--bg2));border-color:var(--accent);color:var(--sky)}
.row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:11px 13px;margin-bottom:8px;
  transition:transform .16s var(--ease-out),border-color .16s ease;
}
.row:hover{transform:translateY(-2px)}
.row.done{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:color-mix(in srgb,var(--gold) 7%,var(--card))}
.w{
  width:52px;flex:none;text-align:center;border-radius:11px;padding:6px 0;
  font-weight:900;font-size:19px;color:#0B1119;line-height:1.05;
}
.w small{display:block;font-size:8.5px;font-weight:800;opacity:.72;letter-spacing:.04em}
.w.closed{background:#2B3A4C;color:var(--sub)}
.nm2{flex:1;min-width:0}
.nm2 b{display:block;font-size:13.5px;font-weight:800;line-height:1.45}
.nm2 span{font-size:10.5px;color:var(--sub);font-weight:700}
.add{
  flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--sub);
  width:40px;height:40px;border-radius:12px;font-size:19px;cursor:pointer;
  transition:transform .12s var(--spring),background .12s ease,color .12s ease;
}
.add:hover{transform:translateY(-2px);color:var(--sky);border-color:var(--sky)}
.add:active{transform:scale(.93)}
.add.on{background:var(--gold);color:#0B1119;border-color:var(--gold)}

/* ── 戦績 ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 15px}
.st .k{font-size:9.5px;color:var(--sub);font-weight:800;letter-spacing:.13em}
.st .v{font-size:30px;line-height:1.15;margin-top:2px}
.st .v em{font-style:normal;font-size:13px;color:var(--sub);margin-left:3px;font-family:"M PLUS Rounded 1c";font-weight:800}
.st.hero{grid-column:1/-1;background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 16%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.st.hero .v{font-size:40px;color:var(--gold)}
.tl{position:relative;padding-left:22px;margin-top:6px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{list-style:none;position:relative;padding:7px 0;font-size:13px}
.tl li::before{content:"";position:absolute;left:-21px;top:14px;width:10px;height:10px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.tl li small{color:var(--sub);font-size:10.5px;margin-left:6px;font-weight:800}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:34px 20px;line-height:1.9}
.sec{font-size:13px;font-weight:900;margin:26px 0 10px;padding-top:20px;border-top:1px solid var(--line);letter-spacing:.04em}
.rate{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px}
.rate-h{display:flex;align-items:baseline;justify-content:space-between}
.rate-h b{font-size:13px;font-weight:800}
.rate-h span{font-size:38px;color:var(--sky);line-height:1}
.rate-h i{font-style:normal;font-size:15px;margin-left:2px}
.bar{height:9px;background:var(--bg);border-radius:999px;overflow:hidden;margin:11px 0 9px}
.bar span{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--sky));
  animation:grow .8s var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0);transform-origin:0 50%}to{transform:scaleX(1)}}
.rate-f{font-size:11px;color:var(--sub);font-weight:800}
.yet{margin-top:12px}
.yet b{font-size:11.5px;color:var(--sub);font-weight:800;letter-spacing:.03em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{border:1px dashed var(--line);color:var(--sub);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:700}
.danger{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:999px;
  padding:7px 16px;font:inherit;font-size:11.5px;font-weight:800;cursor:pointer;display:block;margin:16px auto 0}
.danger:hover{border-color:var(--bad);color:var(--bad)}

footer{color:var(--sub);font-size:10.5px;text-align:center;padding:26px 20px 34px;line-height:1.9}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="logo"><b>パークログ</b><span class="dsp">USJ</span></div>
    <button class="honey" id="hn" aria-label="先輩のテーマを再生">🍯</button>
    <button class="rf" id="rf">更新</button>
  </div>
</header>

<main class="wrap">

  <div class="crowd">
    <div><span class="big dsp num" id="cs">--</span><span class="u">分</span></div>
    <div class="meta">
      <div class="lv" id="clv">読み込み中</div>
      <div class="sub" id="cst">全アトラクションの平均待ち時間</div>
    </div>
  </div>

  <div class="mapcard">
    <div class="mapbox">
      <svg class="map" id="map" viewBox="0 0 560 600" role="img" aria-label="USJ 待ち時間マップ"><g id="vp"></g></svg>
      <div class="zc">
        <button id="zi" aria-label="拡大">＋</button>
        <button id="zo" aria-label="縮小">−</button>
        <button id="zr" aria-label="全体表示">⤢</button>
      </div>
    </div>
    <div class="legend">
      <span><i style="background:#3FBF6F"></i>〜20分</span>
      <span><i style="background:#F5B942"></i>〜50分</span>
      <span><i style="background:#F0554E"></i>50分〜</span>
      <span><i style="background:#1F6FEB"></i>今日のルート</span>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-t="list">待ち時間</button>
    <button class="tab" role="tab" aria-selected="false" data-t="log">今日の戦績</button>
  </div>

  <section id="p-list">
    <div class="sortbar">
      <button class="chip" data-s="wait" aria-pressed="true">待ち時間が長い順</button>
      <button class="chip" data-s="short" aria-pressed="false">空いてる順</button>
      <button class="chip" data-s="name" aria-pressed="false">名前順</button>
      <button class="chip" id="cl" aria-pressed="false">休止中も表示</button>
    </div>
    <div id="rows"></div>
  </section>

  <section id="p-log" class="hide"></section>

</main>

<div class="sheet" id="sh" hidden>
  <div class="sheet-in">
    <h3>先輩のテーマ 🍯</h3>
    <p>くまのプーさん（森の奥深く〜のやつ）／ お使いの音楽アプリで開きます</p>
    <a id="m-sp" href="#" target="_blank" rel="noopener"><i>🟢</i>Spotify で聴く</a>
    <a id="m-am" href="#" target="_blank" rel="noopener"><i>🍎</i>Apple Music で聴く</a>
    <a id="m-ym" href="#" target="_blank" rel="noopener"><i>▶️</i>YouTube Music で聴く</a>
    <button class="danger" id="shx" style="width:100%;margin-top:10px">閉じる</button>
  </div>
</div>

<footer>
  待ち時間データ: themeparks.wiki（非公式・数分の遅延あり）<br>
  地図は実測座標から自作したもので、公式マップではありません<br>
  記録はこの端末の中だけに保存されます
</footer>

<script>
const PARK = '47f61fac-7586-41ac-ae80-61c9257cf33e';
const API  = 'https://api.themeparks.wiki/v1/entity/' + PARK;
const LS   = 'usjlog.v1';

/* 主要アトラクションの和名。APIは英語しか返さないので手当て。
   ponytail: 未収録は英語のまま出す。増やしたい時はここに1行足すだけ */
const JA = {
  'Mine Cart Madness™':'ドンキーコングのクレイジー・トロッコ',
  'Mario Kart: Koopa’s Challenge™':'マリオカート 〜クッパの挑戦状〜',
  "Mario Kart: Koopa's Challenge™":'マリオカート 〜クッパの挑戦状〜',
  "Yoshi's Adventure™":'ヨッシー・アドベンチャー',
  'Power-Up Band™ Key Challenges':'パワーアップバンド・キーチャレンジ',
  'Harry Potter and the Forbidden Journey™':'ハリー・ポッター・アンド・ザ・フォービドゥン・ジャーニー',
  'Flight of the Hippogriff™':'フライト・オブ・ザ・ヒッポグリフ',
  'Hollywood Dream - The Ride':'ハリウッド・ドリーム・ザ・ライド',
  'Hollywood Dream - The Ride: Backdrop':'ハリウッド・ドリーム 〜バックドロップ〜',
  'Space Fantasy - The Ride':'スペース・ファンタジー・ザ・ライド',
  'Space Fantasy - The Ride: CLUB ZEDD REMIX':'スペース・ファンタジー（CLUB ZEDD）',
  'The Flying Dinosaur':'ザ・フライング・ダイナソー',
  'Jurassic Park - The Ride':'ジュラシック・パーク・ザ・ライド',
  'Jurassic Park - The Ride: Discover U!!! Version':'ジュラシック・パーク・ザ・ライド',
  'Jurassic World Mission Walk':'ジュラシック・ワールド・ミッションウォーク',
  'JAWS':'ジョーズ',
  'Despicable Me: Minion Mayhem':'ミニオン・ハチャメチャ・ライド',
  'Freeze Ray Sliders':'フリーズ・レイ・スライダー',
  'Illumination’s Villain-Con Minion Blast':'ヴィラン・コン ミニオン・ブラスト',
  'Snoopy’s Flying Ace Adventure':'スヌーピーのグレートレース',
  "Snoopy's Flying Ace Adventure":'スヌーピーのグレートレース',
  'The Flying Snoopy':'フライング・スヌーピー',
  "Hello Kitty's Cupcake Dream":'ハローキティのカップケーキ・ドリーム',
  'Detective Conan: The World':'名探偵コナン・ザ・ワールド',
  'Detective Conan 4-D Live Show: Jewel Under the Starry Sky':'名探偵コナン 4-Dライブ・ショー',
  'JUJUTSU KAISEN: The Real 4-D — Clock Tower of Recurrence':'呪術廻戦 ザ・リアル 4-D',
  'WaterWorld':'ウォーターワールド'
};
const ja = n => JA[n] || n;

/* エリア（座標から手置き）。地図の"場所感"を出すためだけの背景 */
const ZONES = [
  {n:'スーパー・ニンテンドー・ワールド', la:34.66800, lo:135.43005, r:96, c:'#E2574C'},
  {n:'ウィザーディング・ワールド',       la:34.66866, lo:135.43185, r:62, c:'#6C5B9E'},
  {n:'ユニバーサル・ワンダーランド',     la:34.66750, lo:135.43345, r:98, c:'#EFA92C'},
  {n:'ハリウッド・エリア',               la:34.66640, lo:135.43455, r:88, c:'#DE6690'},
  {n:'アミティ・ビレッジ',               la:34.66600, lo:135.43165, r:62, c:'#3D86AC'},
  {n:'ジュラシック・パーク',             la:34.66445, lo:135.43062, r:74, c:'#3E7C50'},
  {n:'ミニオン・パーク',                 la:34.66345, lo:135.43245, r:68, c:'#E8C22F'}
];
/* 中央のラグーン（実測でアトラクションが1つも無い空白＝実際の池の位置） */
const LAGOON = {la:34.66605, lo:135.43272, rx:74, ry:56};

const S = { data:[], showClosed:false, sort:'wait', hist:{days:{},names:{}}, log:[] };
const today = () => new Date().toLocaleDateString('sv-SE');   // YYYY-MM-DD（現地時刻）
try{
  S.hist = JSON.parse(localStorage.getItem(LS)) || {};
  S.hist.days = S.hist.days || {};
  S.hist.names = S.hist.names || {};
  /* v1（日付を持たない当日ぶんだけの配列）からの引き継ぎ */
  const v1 = JSON.parse(localStorage.getItem('usjlog.v1') || 'null');
  if(Array.isArray(v1) && v1.length && !S.hist.days[today()]) S.hist.days[today()] = v1;
  localStorage.removeItem('usjlog.v1');
}catch(e){ S.hist = {days:{},names:{}}; }
if(!S.hist.days[today()]) S.hist.days[today()] = [];
S.log = S.hist.days[today()];        /* 参照を保持。中身だけ触ること */
const save = () => localStorage.setItem(LS, JSON.stringify(S.hist));

/* 緯度経度 → 画面座標。パークは約600m四方なのでメルカトル補正は不要、
   経度だけ cos(緯度) で潰せば実寸比になる */
const LA0=34.66280, LA1=34.66940, LO0=135.42940, LO1=135.43680;
const KX = Math.cos(34.666*Math.PI/180);
const W=560, H=600, PAD=34;
const spanX=(LO1-LO0)*KX, spanY=(LA1-LA0);
const sc = Math.min((W-PAD*2)/spanX, (H-PAD*2)/spanY);
const px = lo => PAD + (lo-LO0)*KX*sc + ((W-PAD*2)-spanX*sc)/2;
const py = la => PAD + (LA1-la)*sc     + ((H-PAD*2)-spanY*sc)/2;
const meters = (a,b) => Math.hypot((a.lo-b.lo)*KX, a.la-b.la) * 111000;

const color = w => w==null ? '#2B3A4C' : w<=20 ? '#3FBF6F' : w<=50 ? '#F5B942' : '#F0554E';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  const b = document.getElementById('rf');
  b.dataset.busy = '1'; b.textContent = '更新中';
  try{
    const [kid, live] = await Promise.all([
      fetch(API+'/children').then(r=>r.json()),
      fetch(API+'/live').then(r=>r.json())
    ]);
    const loc = {};
    kid.children.forEach(c => { if (c.location && c.location.latitude) loc[c.id] = c.location; });

    const seen = {};
    S.data = live.liveData
      .filter(x => x.entityType === 'ATTRACTION' && loc[x.id])
      .map(x => ({
        id:x.id, name:ja(x.name),
        wait: ((x.queue||{}).STANDBY||{}).waitTime,
        open: x.status === 'OPERATING',
        la: loc[x.id].latitude, lo: loc[x.id].longitude
      }))
      /* 同一ライドの別バージョン（バックドロップ等）が同名で重複するので落とす */
      .filter(x => seen[x.name] ? false : (seen[x.name] = 1));

    render();
  }catch(e){
    document.getElementById('clv').textContent = '取得に失敗しました';
    document.getElementById('cst').textContent = '通信環境を確認して「更新」を押してください';
  }
  b.dataset.busy = ''; b.textContent = '更新';
}

function render(){ crowd(); map(); rows(); logPane(); }

function crowd(){
  const ws = S.data.filter(x=>x.open && x.wait!=null).map(x=>x.wait);
  if(!ws.length) return;
  const avg = Math.round(ws.reduce((a,b)=>a+b,0)/ws.length);
  const lv = avg<15 ? ['ガラガラ','今日は当たり日。人気どころから回れます']
          : avg<25 ? ['空いてる','待ちが短い。効率よく詰められます']
          : avg<40 ? ['ふつう','標準的な混み方。人気は先に押さえたい']
          : avg<55 ? ['混雑','待ちが伸びています。エクスプレス検討ライン']
          :          ['激混み','長期戦。ショーと食事で時間を使う日'];
  document.getElementById('cs').textContent = avg;
  document.getElementById('clv').textContent = lv[0];
  document.getElementById('cst').textContent = lv[1] + '　/　稼働 ' + ws.length + '施設の平均';
}

/* 隣接ライドは実測で20m程度しか離れておらず、そのまま打つとピンが重なって
   数字が読めない。実座標は距離計算に残したまま、描画位置だけ反発で離す */
function declutter(p, gap){
  for(let k=0;k<80;k++){
    let moved = false;
    for(let i=0;i<p.length;i++) for(let j=i+1;j<p.length;j++){
      let dx = p[j].x-p[i].x, dy = p[j].y-p[i].y;
      const d = Math.hypot(dx,dy) || 0.01;
      if(d < gap){
        const f = (gap-d)/2/d;
        dx*=f; dy*=f;
        p[i].x-=dx; p[i].y-=dy; p[j].x+=dx; p[j].y+=dy;
        moved = true;
      }
    }
    if(!moved) break;
  }
}

/* パークマップ風の下地。公式マップは著作物なので使わず、実測座標から自前で描く */
function base(){
  let s = '<rect x="-400" y="-400" width="1400" height="1400" fill="#EDE3CE"/>';
  /* 園内をぐるりと回る本通り（実際のUSJもラグーンを囲む環状） */
  const ring = [3,2,1,0,4,5,6].map(i => px(ZONES[i].lo).toFixed(1)+','+py(ZONES[i].la).toFixed(1)).join(' ');
  s += '<polygon points="'+ring+'" fill="#E4F0DA" stroke="#FBF5E7" stroke-width="30" stroke-linejoin="round"/>';
  /* エリア。円を重ねて有機的な塊にする（g にまとめないと重なりが濃くなる） */
  ZONES.forEach(z=>{
    const X=px(z.lo), Y=py(z.la);
    s += '<g fill="'+z.c+'" opacity=".30">'
      +  [[0,0,1],[.46,-.28,.70],[-.42,.34,.64],[.3,.42,.58]].map(([dx,dy,k]) =>
           '<circle cx="'+(X+dx*z.r).toFixed(1)+'" cy="'+(Y+dy*z.r).toFixed(1)+'" r="'+(z.r*k).toFixed(1)+'"/>').join('')
      +  '</g>';
  });
  /* 中央のラグーン */
  const LX=px(LAGOON.lo), LY=py(LAGOON.la);
  s += '<ellipse cx="'+LX.toFixed(1)+'" cy="'+LY.toFixed(1)+'" rx="'+LAGOON.rx+'" ry="'+LAGOON.ry+'" fill="#9FCFE4"/>'
    +  '<ellipse cx="'+LX.toFixed(1)+'" cy="'+(LY-6).toFixed(1)+'" rx="'+(LAGOON.rx-13)+'" ry="'+(LAGOON.ry-13)+'" fill="#B4DCEC" opacity=".8"/>'
    +  '<text class="lagoon-l" x="'+LX.toFixed(1)+'" y="'+(LY+4).toFixed(1)+'" text-anchor="middle">ラグーン</text>';
  /* 植栽。のっぺり防止 */
  [[34.6672,135.4312],[34.6650,135.4310],[34.6638,135.4335],[34.6683,135.4325],
   [34.6663,135.4344],[34.6655,135.4300],[34.6690,135.4297],[34.6647,135.4340]].forEach(([la,lo],i)=>{
    const X=px(lo), Y=py(la), r=13+(i%3)*4;
    s += '<g fill="#8FB870" opacity=".55"><circle cx="'+X+'" cy="'+Y+'" r="'+r+'"/>'
      +  '<circle cx="'+(X+r*.7)+'" cy="'+(Y+r*.4)+'" r="'+(r*.72)+'"/></g>';
  });
  ZONES.forEach(z=>{
    s += '<text class="zone-l" x="'+px(z.lo).toFixed(1)+'" y="'+(py(z.la)-z.r+13).toFixed(1)+'" text-anchor="middle">'+z.n+'</text>';
  });
  return s;
}

function map(){
  let s = base();

  const pts = S.data.filter(x=>x.open && x.wait!=null)
                    .map(x => ({...x, x:px(x.lo), y:py(x.la)}));
  declutter(pts, 39);

  const done = S.log.map(id => pts.find(p=>p.id===id)).filter(Boolean);
  if(done.length>1){
    s += '<polyline class="route" points="'+done.map(d=>d.x.toFixed(1)+','+d.y.toFixed(1)).join(' ')+'"/>';
  }
  /* ピンを離しても文字幅までは吸収できないので、
     ラベルは上下4段の候補から先に置いた箱と当たらない位置を選ぶ */
  /* ピン自体も障害物。これが無いとラベルが数字の下に潜る */
  const boxes = pts.map(p => ({x1:p.x-17, x2:p.x+17, y1:p.y-17, y2:p.y+17}));
  const slot = p => {
    const w = Math.min(p.name.length,8)*8.4;
    for(const dy of [29,-21,41,-33,53,-45,65,-57]){
      const b = {x1:p.x-w/2, x2:p.x+w/2, y1:p.y+dy-7, y2:p.y+dy+4};
      if(!boxes.some(o => b.x1<o.x2 && b.x2>o.x1 && b.y1<o.y2 && b.y2>o.y1)){
        boxes.push(b); return p.y+dy;
      }
    }
    return null;   /* 置き場所が無ければ描かない。名前はリストと吹き出しにある */
  };
  pts.forEach(p=>{
    const on = S.log.includes(p.id), ly = slot(p);
    s += '<g class="pin'+(on?' done':'')+'" data-id="'+p.id+'">'
       +   '<title>'+esc(p.name)+' / '+p.wait+'分待ち</title>'
       +   '<circle class="dot" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="15" fill="'+color(p.wait)+'"/>'
       +   '<text x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'">'+p.wait+'</text>'
       +   (ly===null ? '' :
           '<text class="nm" x="'+p.x.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle">'+esc(p.name.slice(0,8))+'</text>')
       + '</g>';
  });
  const vp = document.getElementById('vp');
  vp.innerHTML = s;
  vp.querySelectorAll('.pin').forEach(g => g.onclick = e => { if(!dragged) toggle(g.dataset.id); });
}

/* ── ズーム／パン。viewBox ではなく g の transform を動かす ── */
let Z = {k:1, x:0, y:0}, dragged = false;
const applyZ = () => document.getElementById('vp')
  .setAttribute('transform','translate('+Z.x+' '+Z.y+') scale('+Z.k+')');
function zoomAt(cx, cy, mul){
  const k = Math.min(5, Math.max(1, Z.k*mul));
  const f = k/Z.k;
  Z.x = cx - (cx-Z.x)*f;  Z.y = cy - (cy-Z.y)*f;  Z.k = k;
  clampZ(); applyZ();
}
/* 引ききった時に地図が枠から離れないよう戻す */
function clampZ(){
  const lim = (Z.k-1);
  Z.x = Math.min(0, Math.max(-560*lim, Z.x));
  Z.y = Math.min(0, Math.max(-600*lim, Z.y));
}
function svgPt(e){
  const r = document.getElementById('map').getBoundingClientRect();
  return [(e.clientX-r.left)/r.width*560, (e.clientY-r.top)/r.height*600];
}
(function bindZoom(){
  const m = document.getElementById('map');
  m.addEventListener('wheel', e => {
    e.preventDefault();
    const [x,y] = svgPt(e);
    zoomAt(x, y, e.deltaY < 0 ? 1.18 : 1/1.18);
  }, {passive:false});

  const ptr = new Map();
  let last = null, pinch = 0;
  m.addEventListener('pointerdown', e => {
    ptr.set(e.pointerId, e); dragged = false;
    if(ptr.size===1){ last = svgPt(e); m.setPointerCapture(e.pointerId); }
  });
  m.addEventListener('pointermove', e => {
    if(!ptr.has(e.pointerId)) return;
    ptr.set(e.pointerId, e);
    const ps = [...ptr.values()];
    if(ps.length >= 2){
      const d = Math.hypot(ps[0].clientX-ps[1].clientX, ps[0].clientY-ps[1].clientY);
      if(pinch){
        const [x,y] = svgPt({clientX:(ps[0].clientX+ps[1].clientX)/2, clientY:(ps[0].clientY+ps[1].clientY)/2});
        zoomAt(x, y, d/pinch);
      }
      pinch = d; dragged = true;
    }else if(last){
      const p = svgPt(e);
      if(Math.hypot(p[0]-last[0], p[1]-last[1]) > 3) dragged = true;
      Z.x += p[0]-last[0]; Z.y += p[1]-last[1];
      last = p; clampZ(); applyZ();
    }
  });
  const up = e => { ptr.delete(e.pointerId); if(ptr.size<2) pinch = 0; if(!ptr.size) last = null; };
  m.addEventListener('pointerup', up);
  m.addEventListener('pointercancel', up);

  document.getElementById('zi').onclick = () => zoomAt(280, 300, 1.5);
  document.getElementById('zo').onclick = () => zoomAt(280, 300, 1/1.5);
  document.getElementById('zr').onclick = () => { Z = {k:1,x:0,y:0}; applyZ(); };
})();

function rows(){
  let d = S.data.filter(x => S.showClosed || x.open);
  d.sort((a,b) =>
      S.sort==='name'  ? a.name.localeCompare(b.name,'ja')
    : S.sort==='short' ? (a.wait??999)-(b.wait??999)
    :                    (b.wait??-1)-(a.wait??-1));
  document.getElementById('rows').innerHTML = d.map(x=>{
    const on = S.log.includes(x.id);
    const w = (!x.open || x.wait==null)
      ? '<div class="w closed">休止</div>'
      : '<div class="w num" style="background:'+color(x.wait)+'">'+x.wait+'<small>MIN</small></div>';
    return '<div class="row'+(on?' done':'')+'">'+w
      + '<div class="nm2"><b>'+esc(x.name)+'</b><span>'
      + (on ? '記録済み' : x.open ? '待ち時間 '+(x.wait??'—')+'分' : '本日休止')
      + '</span></div>'
      + '<button class="add'+(on?' on':'')+'" data-id="'+x.id+'" aria-label="乗った記録">'+(on?'✓':'+')+'</button></div>';
  }).join('');
  document.querySelectorAll('.add').forEach(b => b.onclick = () => toggle(b.dataset.id));
}

function toggle(id){
  const i = S.log.indexOf(id);
  if(i>=0) S.log.splice(i,1);
  else{
    S.log.push(id);
    const a = S.data.find(x=>x.id===id);
    if(a) S.hist.names[id] = a.name;   /* APIから消えた後も通算に名前を残す */
  }
  save(); render();
}

function logPane(){
  const el = document.getElementById('p-log');
  const items = S.log.map(id => S.data.find(x=>x.id===id)).filter(Boolean);

  /* ── 今日 ── */
  let html;
  if(!items.length){
    html = '<div class="empty">今日はまだ記録がありません。<br>乗ったアトラクションの <b>＋</b> を押すと、<br>ルートと戦績がここに残ります。</div>';
  }else{
    const wait = items.reduce((a,b)=>a+(b.wait||0),0);
    let dist = 0;
    for(let i=1;i<items.length;i++) dist += meters(items[i-1], items[i]);
    /* ponytail: 移動距離は記録順の直線距離の合計。実際の順路より短く出る。
       GPSを入れるならここを置き換える */
    html =
      '<div class="stats">'
      + '<div class="st hero"><div class="k">TODAY</div><div class="v dsp num">'+items.length+'<em>アトラクション制覇</em></div></div>'
      + '<div class="st"><div class="k">TOTAL WAIT</div><div class="v dsp num">'+wait+'<em>分 並んだ</em></div></div>'
      + '<div class="st"><div class="k">DISTANCE</div><div class="v dsp num">'+(dist/1000).toFixed(2)+'<em>km 歩いた</em></div></div>'
      + '</div>'
      + '<ol class="tl">' + items.map(x =>
          '<li>'+esc(x.name)+'<small class="num">'+(x.wait!=null?x.wait+'分待ち':'—')+'</small></li>').join('')
      + '</ol>'
      + '<button class="danger" id="cr">今日の記録をリセット</button>';
  }

  /* ── 通算（公式に無いところ。ここが積み上がるほど戻ってくる理由になる） ── */
  const ever = new Set(Object.values(S.hist.days).flat());
  const rides = Object.values(S.hist.days).reduce((a,b)=>a+b.length,0);
  const visits = Object.values(S.hist.days).filter(d=>d.length).length;
  if(S.data.length && ever.size){
    const total = S.data.length;
    const pct = Math.round(ever.size/total*100);
    const yet = S.data.filter(x=>!ever.has(x.id));
    html += '<h2 class="sec">通算記録</h2>'
      + '<div class="rate">'
      +   '<div class="rate-h"><b>制覇率</b><span class="dsp num">'+pct+'<i>%</i></span></div>'
      +   '<div class="bar"><span style="width:'+pct+'%"></span></div>'
      +   '<div class="rate-f num">'+ever.size+' / '+total+' アトラクション　・　通算 '+rides+' 回　・　'+visits+' 日来園</div>'
      + '</div>';
    if(yet.length){
      html += '<div class="yet"><b>まだ乗っていない '+yet.length+' 件</b><div class="tags">'
        + yet.map(x=>'<span class="tag">'+esc(x.name)+'</span>').join('') + '</div></div>';
    }else{
      html += '<div class="yet"><b>全アトラクション制覇。もう乗るものがありません。</b></div>';
    }
  }

  el.innerHTML = html;
  const cr = document.getElementById('cr');
  if(cr) cr.onclick = () => {
    if(confirm('今日の記録を全部消します。通算記録は残ります。')){ S.log.length = 0; save(); render(); }
  };
}

/* ── UI配線 ── */
document.getElementById('rf').onclick = load;
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(o => o.setAttribute('aria-selected', o===t));
  document.getElementById('p-list').classList.toggle('hide', t.dataset.t!=='list');
  document.getElementById('p-log').classList.toggle('hide', t.dataset.t!=='log');
});
document.querySelectorAll('[data-s]').forEach(c => c.onclick = () => {
  S.sort = c.dataset.s;
  document.querySelectorAll('[data-s]').forEach(o => o.setAttribute('aria-pressed', o===c));
  rows();
});
document.getElementById('cl').onclick = function(){
  S.showClosed = !S.showClosed;
  this.setAttribute('aria-pressed', S.showClosed);
  this.textContent = S.showClosed ? '休止中を隠す' : '休止中も表示';
  rows();
};

load();
setInterval(load, 60000);   // 1分ごとに自動更新
</script>
