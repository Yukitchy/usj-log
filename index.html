<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パークログ USJ — 待ち時間 × その日の記録</title>
<meta name="theme-color" content="#0E141C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet"><style>
:root{
  --bg:#0E141C;          /* 地：夜の藍 */
  --bg2:#151E29;
  --card:#1A2533;
  --line:#27384B;
  --ink:#EAF1F8;
  --sub:#8FA4BB;
  --accent:#2E86FF;      /* 主役：地図の青 */
  --sky:#4FB0FF;
  /* 意味の色（アクセントとは別に持つ） */
  --ok:#3FBF6F;
  --warn:#F5B942;
  --bad:#F0554E;
  --gold:#FFC24B;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body,p,li,td,th,div,span,b,small,summary,button,a,h1,h2,h3,h4{
  word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere;
}
h1,h2,h3,h4,.btn,.chip,.pill,.tag,.eyebrow,.note,.hint{text-wrap:balance}
p{text-wrap:pretty}
body{
  background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c",-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.75;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.num{font-variant-numeric:tabular-nums}
.dsp{font-family:"Lilita One",sans-serif;font-weight:400;letter-spacing:.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* ── ヘッダー ── */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(14,20,28,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 0}
.logo{display:flex;align-items:baseline;gap:7px;flex:1;min-width:0}
.logo b{font-size:17px;font-weight:900;letter-spacing:.02em}
.logo span{font-size:10px;color:var(--sub);letter-spacing:.14em;font-weight:800}
.rf{
  border:1px solid var(--line);background:var(--bg2);color:var(--sub);
  border-radius:999px;padding:6px 13px;font:inherit;font-size:12px;font-weight:800;
  cursor:pointer;white-space:nowrap;
  transition:transform .12s var(--spring),border-color .12s ease,color .12s ease;
}
.rf:hover{transform:translateY(-1px);border-color:var(--sky);color:var(--sky)}
.rf:active{transform:translateY(0) scale(.97)}
.rf[data-busy="1"]{opacity:.5;pointer-events:none}

/* ── 混雑スコア ── */
.crowd{
  display:flex;align-items:center;gap:16px;
  background:linear-gradient(160deg,var(--bg2),var(--card));
  border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0 12px;
  position:relative;overflow:hidden;
  animation:in .6s var(--ease-out) both;
}
.crowd::before{
  content:"";position:absolute;top:-90px;right:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(46,134,255,.20),transparent 70%);pointer-events:none;
}
.crowd .big{font-size:52px;line-height:.9;letter-spacing:-.01em}
.crowd .u{font-size:15px;color:var(--sub);margin-left:3px}
.crowd .meta{flex:1;min-width:0}
.crowd .lv{font-size:19px;font-weight:900;line-height:1.3}
.crowd .sub{font-size:11.5px;color:var(--sub);line-height:1.6}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ── 地図 ── */
.mapcard{
  background:var(--bg2);border:1px solid var(--line);border-radius:20px;
  padding:8px;position:relative;overflow:hidden;
  animation:in .6s .06s var(--ease-out) both;
}
.mapbox{position:relative}
svg.map{display:block;width:100%;height:auto;border-radius:14px;background:#EDE3CE;
  touch-action:none;cursor:grab;overflow:hidden}
svg.map:active{cursor:grabbing}
.zc{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:5px}
.zc button{
  width:34px;height:34px;border-radius:11px;border:1px solid rgba(43,33,24,.16);
  background:rgba(255,252,246,.94);color:#3B3226;font:inherit;font-size:16px;font-weight:900;
  cursor:pointer;box-shadow:0 2px 6px rgba(60,45,25,.18);
  transition:transform .12s var(--spring),background .12s ease;
}
.zc button:hover{transform:translateY(-1px);background:#fff}
.zc button:active{transform:scale(.93)}
.zone-l{font-size:10px;font-weight:800;fill:#5A4C36;letter-spacing:.02em;paint-order:stroke;
  stroke:rgba(255,251,242,.75);stroke-width:3px}
.lagoon-l{font-size:10px;font-weight:800;fill:#3F7F9C;letter-spacing:.06em}
.pin{cursor:pointer}
.pin circle{transition:r .14s var(--ease-out)}
.pin:hover circle.dot{r:19}
.pin text{font-size:12px;font-weight:900;fill:#1B1206;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-variant-numeric:tabular-nums}
.pin circle.dot{stroke:rgba(255,255,255,.92);stroke-width:2}
.pin.done circle.dot{stroke:#2B2118;stroke-width:3}
.pin .nm{font-size:9px;fill:#463B2B;font-weight:800;dominant-baseline:auto;paint-order:stroke;
  stroke:rgba(255,251,242,.85);stroke-width:3px}
.route{fill:none;stroke:#1F6FEB;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:8 6;opacity:.95}

.mbadge{font-size:11px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.mcnt{font-size:9px;font-weight:900;fill:#463B2B;text-anchor:middle;paint-order:stroke;
  stroke:rgba(255,251,242,.9);stroke-width:3px}
.pth{cursor:zoom-in}

/* 日別ストリップ */
.daystrip{display:flex;gap:7px;overflow-x:auto;padding:11px 4px 3px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.day{
  flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--sub);
  border-radius:12px;padding:6px 13px;font:inherit;cursor:pointer;text-align:left;
  transition:all .14s ease}
.day b{display:block;font-size:12.5px;font-weight:900;line-height:1.35}
.day span{font-size:9.5px;font-weight:800;opacity:.85}
.day.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 記録に写真を足す */
.tl-h{display:flex;align-items:center;gap:8px}
.tl-h>span{flex:1;min-width:0}
.cam{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:10px;
  width:32px;height:30px;font-size:14px;cursor:pointer;line-height:1;
  transition:transform .12s var(--spring),border-color .12s ease}
.cam:hover{transform:translateY(-2px);border-color:var(--sky)}
.cam:active{transform:scale(.92)}
.film{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.film::-webkit-scrollbar{display:none}
.th{position:relative;border:1px solid var(--line);background:var(--bg2);border-radius:11px;
  overflow:hidden;cursor:zoom-in;padding:0;display:block;
  transition:transform .14s var(--ease-out)}
.th:hover{transform:translateY(-2px)}
.th img,.th video{display:block;width:100%;height:100%;object-fit:cover}
.th.sm{flex:none;width:58px;height:58px;border-radius:10px}
.th i{position:absolute;inset:auto 4px 3px auto;font-size:10px;font-style:normal;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.th span{position:absolute;left:0;right:0;bottom:0;font-size:9px;font-weight:800;color:#fff;
  padding:9px 5px 4px;background:linear-gradient(transparent,rgba(0,0,0,.72));text-align:left}
.grid-m{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid-m .th{aspect-ratio:1}
.sec small{font-size:10.5px;color:var(--sub);font-weight:800}

/* プラン */
.proute{fill:none;stroke:#F07C1F;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.pno text{font-size:11px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}
.lead{font-size:12px;color:var(--sub);line-height:1.85;margin-bottom:13px;font-weight:700}
.plan{list-style:none;margin-bottom:12px}
.plan li{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:9px 11px;margin-bottom:7px}
.plan li b{width:26px;height:26px;flex:none;border-radius:9px;background:#F07C1F;color:#1B1206;
  display:grid;place-items:center;font-size:14px}
.plan li>span{flex:1;min-width:0;font-size:13px;font-weight:800;line-height:1.45}
.plan li small{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
.mv{flex:none;width:29px;height:29px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg2);color:var(--sub);font:inherit;font-size:13px;cursor:pointer}
.mv:hover{border-color:var(--sky);color:var(--sky)}
.mv.rm:hover{border-color:var(--bad);color:var(--bad)}
.pick2{display:flex;flex-wrap:wrap;gap:6px}
.pk{border:1px solid var(--line);background:var(--bg2);color:var(--sub);border-radius:999px;
  padding:6px 12px;font:inherit;font-size:11.5px;font-weight:800;cursor:pointer;
  transition:all .14s ease}
.pk i{font-style:normal;margin-right:5px}
.pk:hover{border-color:var(--sky);color:var(--sky)}
.pk.on{background:color-mix(in srgb,#F07C1F 24%,var(--bg2));border-color:#F07C1F;color:#FFC48A}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.act{flex:1;min-width:120px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);
  border-radius:12px;padding:11px 8px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
  transition:transform .12s var(--spring),border-color .12s ease}
.act:hover{transform:translateY(-2px);border-color:var(--sky)}
.act:active{transform:scale(.97)}
.act.on{background:color-mix(in srgb,var(--gold) 20%,var(--bg2));border-color:var(--gold);color:var(--gold)}
.act.big{background:var(--accent);border-color:var(--accent);color:#fff;flex:2}

/* 詳細ポップアップ */
.hero{border-radius:14px;overflow:hidden;margin-bottom:13px;background:var(--bg2)}
.hero img,.hero video{display:block;width:100%;max-height:230px;object-fit:cover}
.hero .ph{height:150px;display:grid;place-items:center;gap:6px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 16%,var(--bg2)),var(--bg2))}
.hero .ph span{font-size:46px;line-height:1}
.hero .ph small{font-size:10.5px;color:var(--sub);font-weight:800}
.bdg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.w2{border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:900;color:#1B1206}
.w2.off{background:#2B3A4C;color:var(--sub)}
.tg{border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:800}
.tg.done{border-color:var(--gold);color:var(--gold)}
.desc{font-size:13px;line-height:1.85}
.desc.dim{color:var(--sub);font-size:12px}
.note-s{font-size:10.5px;color:var(--sub);line-height:1.75;margin:10px 0;font-weight:700}
#sp-embed{border-radius:12px;overflow:hidden;min-height:80px}

/* 天気 */
.wx{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg2);
  border-radius:999px;padding:5px 11px 5px 9px;font:inherit;cursor:pointer;color:var(--ink);
  transition:transform .12s var(--spring),border-color .12s ease}
.wx:hover{transform:translateY(-1px);border-color:var(--sky)}
.wx span{font-size:13px;line-height:1}
.wx b{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums}
.wxrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.wxrow::-webkit-scrollbar{display:none}
.wxh{flex:none;width:56px;text-align:center;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:9px 4px}
.wxh span{display:block;font-size:10px;color:var(--sub);font-weight:800}
.wxh b{display:block;font-size:19px;margin:3px 0;line-height:1.1}
.wxh em{display:block;font-style:normal;font-size:13px;font-weight:900}
.wxh i{display:block;font-style:normal;font-size:10px;color:var(--sky);font-weight:800;margin-top:2px}

/* 拡大ビューア */
.viewer[hidden]{display:none}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(4,7,11,.93);
  display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s ease both}
.vw-in{position:relative;max-width:min(94vw,760px);width:100%}
.vw-in img,.vw-in video{display:block;width:100%;max-height:74vh;object-fit:contain;border-radius:14px}
.vw-b{display:flex;align-items:center;gap:10px;margin-top:11px;color:var(--ink)}
.vw-b b{font-size:13px;font-weight:800;flex:1;min-width:0}
.vw-b span{font-size:11px;color:var(--sub);font-weight:800;white-space:nowrap}
.vw-del{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;
  padding:5px 13px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}
.vw-del:hover{border-color:var(--bad);color:var(--bad)}
.vw-n{position:absolute;top:50%;transform:translateY(-50%);border:0;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;width:42px;height:60px;font-size:26px;line-height:1}
.vw-p{left:0;border-radius:0 12px 12px 0}
.vw-x{right:0;border-radius:12px 0 0 12px}

/* 先輩のテーマ */
.honey{
  border:1px solid var(--line);background:var(--bg2);border-radius:999px;
  width:34px;height:34px;font-size:16px;cursor:pointer;line-height:1;
  transition:transform .12s var(--spring),border-color .12s ease;
}
.honey:hover{transform:translateY(-1px) rotate(-8deg);border-color:var(--gold)}
.honey:active{transform:scale(.9)}
.sheet[hidden]{display:none}   /* display:flex は hidden より強いので明示 */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(6,10,15,.66);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{
  background:var(--card);border:1px solid var(--line);border-bottom:0;
  border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;animation:up .32s var(--ease-out) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-in h3{font-size:16px;font-weight:900}
.sheet-in p{font-size:12px;color:var(--sub);margin:3px 0 16px;font-weight:700}
.sheet-in a{
  display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);
  background:var(--bg2);border:1px solid var(--line);border-radius:13px;
  padding:12px 15px;margin-bottom:8px;font-size:13.5px;font-weight:800;
  transition:transform .14s var(--ease-out),border-color .14s ease}
.sheet-in a:hover{transform:translateY(-2px);border-color:var(--sky)}
.sheet-in a i{font-style:normal;font-size:17px}
.legend{display:flex;gap:12px;justify-content:center;padding:9px 4px 3px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legend span{font-size:10.5px;color:var(--sub);font-weight:800}

/* ── タブ ── */
.tabs{display:flex;gap:6px;margin:16px 0 10px;background:var(--bg2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.tab{
  flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:13px;font-weight:800;
  padding:9px 4px;border-radius:10px;cursor:pointer;transition:background .16s ease,color .16s ease;
}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}

/* ── リスト ── */
.sortbar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.chip{
  border:1px solid var(--line);background:var(--bg2);color:var(--sub);
  border-radius:999px;padding:5px 12px;font:inherit;font-size:11.5px;font-weight:800;
  cursor:pointer;white-space:nowrap;transition:all .14s ease;
}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--bg2));border-color:var(--accent);color:var(--sky)}
.row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:11px 13px;margin-bottom:8px;
  transition:transform .16s var(--ease-out),border-color .16s ease;
}
.row:hover{transform:translateY(-2px)}
.row.done{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:color-mix(in srgb,var(--gold) 7%,var(--card))}
.w{
  width:52px;flex:none;text-align:center;border-radius:11px;padding:6px 0;
  font-weight:900;font-size:19px;color:#0B1119;line-height:1.05;
}
.w small{display:block;font-size:8.5px;font-weight:800;opacity:.72;letter-spacing:.04em}
.w.closed{background:#2B3A4C;color:var(--sub)}
.nm2{flex:1;min-width:0}
.nm2 b{display:block;font-size:13.5px;font-weight:800;line-height:1.45}
.nm2 span{font-size:10.5px;color:var(--sub);font-weight:700}
.add{
  flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--sub);
  width:40px;height:40px;border-radius:12px;font-size:19px;cursor:pointer;
  transition:transform .12s var(--spring),background .12s ease,color .12s ease;
}
.add:hover{transform:translateY(-2px);color:var(--sky);border-color:var(--sky)}
.add:active{transform:scale(.93)}
.add.on{background:var(--gold);color:#0B1119;border-color:var(--gold)}

/* ── 戦績 ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 15px}
.st .k{font-size:9.5px;color:var(--sub);font-weight:800;letter-spacing:.13em}
.st .v{font-size:30px;line-height:1.15;margin-top:2px}
.st .v em{font-style:normal;font-size:13px;color:var(--sub);margin-left:3px;font-family:"M PLUS Rounded 1c";font-weight:800}
.st.hero{grid-column:1/-1;background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 16%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.st.hero .v{font-size:40px;color:var(--gold)}
.tl{position:relative;padding-left:22px;margin-top:6px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{list-style:none;position:relative;padding:7px 0;font-size:13px}
.tl li::before{content:"";position:absolute;left:-21px;top:14px;width:10px;height:10px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.tl li small{color:var(--sub);font-size:10.5px;margin-left:6px;font-weight:800}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:34px 20px;line-height:1.9}
.sec{font-size:13px;font-weight:900;margin:26px 0 10px;padding-top:20px;border-top:1px solid var(--line);letter-spacing:.04em}
.rate{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px}
.rate-h{display:flex;align-items:baseline;justify-content:space-between}
.rate-h b{font-size:13px;font-weight:800}
.rate-h span{font-size:38px;color:var(--sky);line-height:1}
.rate-h i{font-style:normal;font-size:15px;margin-left:2px}
.bar{height:9px;background:var(--bg);border-radius:999px;overflow:hidden;margin:11px 0 9px}
.bar span{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--sky));
  animation:grow .8s var(--ease-out) both}
@keyframes grow{from{transform:scaleX(0);transform-origin:0 50%}to{transform:scaleX(1)}}
.rate-f{font-size:11px;color:var(--sub);font-weight:800}
.yet{margin-top:12px}
.yet b{font-size:11.5px;color:var(--sub);font-weight:800;letter-spacing:.03em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{border:1px dashed var(--line);color:var(--sub);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:700}
.danger{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:999px;
  padding:7px 16px;font:inherit;font-size:11.5px;font-weight:800;cursor:pointer;display:block;margin:16px auto 0}

  'フリーズ・レイ・スライダー':{e:'🧊',t:'ファミリー',d:'短い滑り台。子連れの合間の一本にちょうどいい。'},
  'ヴィラン・コン ミニオン・ブラスト':{e:'🔫',t:'歩く',d:'歩きながら撃つシューティング。列の進みが早いので待ち時間の見た目ほど待たない。'},

  'ハローキティのカップケーキ・ドリーム':{e:'🎀',t:'ファミリー',d:'ほぼ記念撮影用。回転はごく穏やか。'},
  '呪術廻戦 ザ・リアル 4-D':{e:'👁',t:'シアター',d:'座って見る4-D。期間限定なので今のうちに。'},

  '名探偵コナン・ザ・ワールド':{e:'🕵️',t:'歩く',d:'歩いて回る展示型。待ち時間の割に中は空いている。'},
  'ウォーターワールド':{e:'💥',t:'ショー',d:'屋外スタントショー。前方の席は本当にずぶ濡れになる。'}

const info = n => INFO[n] || {e:'🎡', t:'', d:''};

/* エリア（座標から手置き）。地図の"場所感"を出すためだけの背景 */
const ZONES = [
  {n:'スーパー・ニンテンドー・ワールド', la:34.66800, lo:135.43005, r:96, c:'#E2574C'},
  {n:'ウィザーディング・ワールド',       la:34.66866, lo:135.43185, r:62, c:'#6C5B9E'},
  {n:'ユニバーサル・ワンダーランド',     la:34.66750, lo:135.43345, r:98, c:'#EFA92C'},
  {n:'ハリウッド・エリア',               la:34.66640, lo:135.43455, r:88, c:'#DE6690'},
  {n:'アミティ・ビレッジ',               la:34.66600, lo:135.43165, r:62, c:'#3D86AC'},
  {n:'ジュラシック・パーク',             la:34.66445, lo:135.43062, r:74, c:'#3E7C50'},
  {n:'ミニオン・パーク',                 la:34.66345, lo:135.43245, r:68, c:'#E8C22F'}
];
/* 中央のラグーン（実測でアトラクションが1つも無い空白＝実際の池の位置） */
const LAGOON = {la:34.66605, lo:135.43272, rx:74, ry:56};

const S = { data:[], showClosed:false, sort:'wait', hist:{days:{},names:{}}, log:[] };
const today = () => new Date().toLocaleDateString('sv-SE');   // YYYY-MM-DD（現地時刻）
try{
  S.hist = JSON.parse(localStorage.getItem(LS)) || {};
  S.hist.days = S.hist.days || {};
  S.hist.names = S.hist.names || {};
  S.hist.waits = S.hist.waits || {};   /* 記録した時点の待ち時間。後から見返す時に正しい */
  /* v1（日付を持たない当日ぶんだけの配列）からの引き継ぎ */
  const v1 = JSON.parse(localStorage.getItem('usjlog.v1') || 'null');
  if(Array.isArray(v1) && v1.length && !S.hist.days[today()]) S.hist.days[today()] = v1;
  localStorage.removeItem('usjlog.v1');
}catch(e){ S.hist = {days:{},names:{}}; }
if(!S.hist.days[today()]) S.hist.days[today()] = [];
S.log = S.hist.days[today()];        /* 参照を保持。中身だけ触ること */
S.viewDay = today();                 /* 地図と戦績が見ている日 */
S.media = [];
S.plan = [];
/* 共有リンク（#p=xxxxxxxx.yyyyyyyy）。実IDへの解決はデータが来てから */
const planSeed = (location.hash.match(/[#&]p=([\w.]+)/) || [,''])[1].split('.').filter(Boolean);
const save = () => localStorage.setItem(LS, JSON.stringify(S.hist));

const dayIds  = d => S.hist.days[d] || [];
const dayDone = () => dayIds(S.viewDay);
/* 過去の日はAPIに無いこともあるので、名前は記録時のものにフォールバック */
const rideOf = id => S.data.find(x=>x.id===id) || (S.hist.names[id] ? {id, name:S.hist.names[id]} : null);
const waitOf = (d,id) => (S.hist.waits[d]||{})[id];
const mediaOf = (d,id) => S.media.filter(m => m.day===d && m.ride===id);
const fmtDay = d => d===today() ? '今日'
  : (+d.slice(5,7)) + '/' + (+d.slice(8,10));

/* ── 写真・動画。localStorageには入らないので IndexedDB に実体で持つ ── */
let DBP;
const db = () => DBP || (DBP = new Promise((res,rej)=>{
  const r = indexedDB.open('usjlog', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('media', {keyPath:'k'});
  r.onsuccess = () => res(r.result);
  r.onerror  = () => rej(r.error);
}));
const tx = (mode, fn) => db().then(d => new Promise((res,rej)=>{
  const t = d.transaction('media', mode), q = fn(t.objectStore('media'));
  t.oncomplete = () => res(q && q.result);
  t.onerror = () => rej(t.error);
}));
const mediaAll = () => tx('readonly', s => s.getAll());
const mediaPut = r => tx('readwrite', s => s.put(r));
const mediaDel = k => tx('readwrite', s => s.delete(k));

const urls = new Map();
const urlOf = m => {
  if(!urls.has(m.k)) urls.set(m.k, URL.createObjectURL(m.blob));
  return urls.get(m.k);
};

/* 緯度経度 → 画面座標。パークは約600m四方なのでメルカトル補正は不要、
   経度だけ cos(緯度) で潰せば実寸比になる */
const LA0=34.66280, LA1=34.66940, LO0=135.42940, LO1=135.43680;
const KX = Math.cos(34.666*Math.PI/180);
const W=560, H=600, PAD=34;
const spanX=(LO1-LO0)*KX, spanY=(LA1-LA0);
const sc = Math.min((W-PAD*2)/spanX, (H-PAD*2)/spanY);
const px = lo => PAD + (lo-LO0)*KX*sc + ((W-PAD*2)-spanX*sc)/2;
const py = la => PAD + (LA1-la)*sc     + ((H-PAD*2)-spanY*sc)/2;
const meters = (a,b) => Math.hypot((a.lo-b.lo)*KX, a.la-b.la) * 111000;

const color = w => w==null ? '#2B3A4C' : w<=20 ? '#3FBF6F' : w<=50 ? '#F5B942' : '#F0554E';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  const b = document.getElementById('rf');
  b.dataset.busy = '1'; b.textContent = '更新中';
  try{
    const [kid, live] = await Promise.all([
      fetch(API+'/children').then(r=>r.json()),
      fetch(API+'/live').then(r=>r.json())
    ]);
    const loc = {};
    kid.children.forEach(c => { if (c.location && c.location.latitude) loc[c.id] = c.location; });

    const seen = {};
    S.data = live.liveData
      .filter(x => x.entityType === 'ATTRACTION' && loc[x.id])
      .map(x => ({
        id:x.id, name:ja(x.name),
        wait: ((x.queue||{}).STANDBY||{}).waitTime,
        open: x.status === 'OPERATING',
        la: loc[x.id].latitude, lo: loc[x.id].longitude
      }))
      /* 同一ライドの別バージョン（バックドロップ等）が同名で重複するので落とす */
      .filter(x => seen[x.name] ? false : (seen[x.name] = 1));

    if(planSeed.length && !S.plan.length){
      S.plan = planSeed.map(p => (S.data.find(x => x.id.startsWith(p)) || {}).id).filter(Boolean);
      if(S.plan.length) document.querySelector('[data-t="plan"]').click();
    }
    render();
  }catch(e){
    document.getElementById('clv').textContent = '取得に失敗しました';
    document.getElementById('cst').textContent = '通信環境を確認して「更新」を押してください';
  }
  b.dataset.busy = ''; b.textContent = '更新';
}

function render(){ crowd(); dayStrip(); map(); rows(); planPane(); logPane(); albumPane(); }

function crowd(){
  const ws = S.data.filter(x=>x.open && x.wait!=null).map(x=>x.wait);
  if(!ws.length) return;
  const avg = Math.round(ws.reduce((a,b)=>a+b,0)/ws.length);
  const lv = avg<15 ? ['ガラガラ','今日は当たり日。人気どころから回れます']
          : avg<25 ? ['空いてる','待ちが短い。効率よく詰められます']
          : avg<40 ? ['ふつう','標準的な混み方。人気は先に押さえたい']
          : avg<55 ? ['混雑','待ちが伸びています。エクスプレス検討ライン']
          :          ['激混み','長期戦。ショーと食事で時間を使う日'];
  document.getElementById('cs').textContent = avg;
  document.getElementById('clv').textContent = lv[0];
  document.getElementById('cst').textContent = lv[1] + '　/　稼働 ' + ws.length + '施設の平均';
}

/* 隣接ライドは実測で20m程度しか離れておらず、そのまま打つとピンが重なって
   数字が読めない。実座標は距離計算に残したまま、描画位置だけ反発で離す */
function declutter(p, gap){
  for(let k=0;k<80;k++){
    let moved = false;
    for(let i=0;i<p.length;i++) for(let j=i+1;j<p.length;j++){
      let dx = p[j].x-p[i].x, dy = p[j].y-p[i].y;
      const d = Math.hypot(dx,dy) || 0.01;
      if(d < gap){
        const f = (gap-d)/2/d;
        dx*=f; dy*=f;
        p[i].x-=dx; p[i].y-=dy; p[j].x+=dx; p[j].y+=dy;
        moved = true;
      }
    }
    if(!moved) break;
  }
}

/* パークマップ風の下地。公式マップは著作物なので使わず、実測座標から自前で描く */
function base(){
  let s = '<rect x="-400" y="-400" width="1400" height="1400" fill="#EDE3CE"/>';
  /* 園内をぐるりと回る本通り（実際のUSJもラグーンを囲む環状） */
  const ring = [3,2,1,0,4,5,6].map(i => px(ZONES[i].lo).toFixed(1)+','+py(ZONES[i].la).toFixed(1)).join(' ');
  s += '<polygon points="'+ring+'" fill="#E4F0DA" stroke="#FBF5E7" stroke-width="30" stroke-linejoin="round"/>';
  /* エリア。円を重ねて有機的な塊にする（g にまとめないと重なりが濃くなる） */
  ZONES.forEach(z=>{
    const X=px(z.lo), Y=py(z.la);
    s += '<g fill="'+z.c+'" opacity=".30">'
      +  [[0,0,1],[.46,-.28,.70],[-.42,.34,.64],[.3,.42,.58]].map(([dx,dy,k]) =>
           '<circle cx="'+(X+dx*z.r).toFixed(1)+'" cy="'+(Y+dy*z.r).toFixed(1)+'" r="'+(z.r*k).toFixed(1)+'"/>').join('')
      +  '</g>';
  });
  /* 中央のラグーン */
  const LX=px(LAGOON.lo), LY=py(LAGOON.la);
  s += '<ellipse cx="'+LX.toFixed(1)+'" cy="'+LY.toFixed(1)+'" rx="'+LAGOON.rx+'" ry="'+LAGOON.ry+'" fill="#9FCFE4"/>'
    +  '<ellipse cx="'+LX.toFixed(1)+'" cy="'+(LY-6).toFixed(1)+'" rx="'+(LAGOON.rx-13)+'" ry="'+(LAGOON.ry-13)+'" fill="#B4DCEC" opacity=".8"/>'
    +  '<text class="lagoon-l" x="'+LX.toFixed(1)+'" y="'+(LY+4).toFixed(1)+'" text-anchor="middle">ラグーン</text>';
  /* 植栽。のっぺり防止 */
  [[34.6672,135.4312],[34.6650,135.4310],[34.6638,135.4335],[34.6683,135.4325],
   [34.6663,135.4344],[34.6655,135.4300],[34.6690,135.4297],[34.6647,135.4340]].forEach(([la,lo],i)=>{
    const X=px(lo), Y=py(la), r=13+(i%3)*4;
    s += '<g fill="#8FB870" opacity=".55"><circle cx="'+X+'" cy="'+Y+'" r="'+r+'"/>'
      +  '<circle cx="'+(X+r*.7)+'" cy="'+(Y+r*.4)+'" r="'+(r*.72)+'"/></g>';
  });
  ZONES.forEach(z=>{
    s += '<text class="zone-l" x="'+px(z.lo).toFixed(1)+'" y="'+(py(z.la)-z.r+13).toFixed(1)+'" text-anchor="middle">'+z.n+'</text>';

  return s;
}

function map(){
  let s = base();

  const pts = S.data.filter(x=>x.open && x.wait!=null)
                    .map(x => ({...x, x:px(x.lo), y:py(x.la)}));
  declutter(pts, 39);

  /* 計画したルート（これから行く順）*/
  const plan = S.plan.map(id => pts.find(p=>p.id===id)).filter(Boolean);
  if(plan.length>1){
    s += '<polyline class="proute" points="'+plan.map(d=>d.x.toFixed(1)+','+d.y.toFixed(1)).join(' ')+'"/>';
  }
  plan.forEach((p,i)=>{
    s += '<g class="pno"><circle cx="'+(p.x-16).toFixed(1)+'" cy="'+(p.y-15).toFixed(1)+'" r="10.5" fill="#F07C1F"/>'
      +  '<text x="'+(p.x-16).toFixed(1)+'" y="'+(p.y-15).toFixed(1)+'">'+(i+1)+'</text></g>';
  });

  /* 実際に回ったルート */
  const done = dayDone().map(id => pts.find(p=>p.id===id)).filter(Boolean);
  if(done.length>1){
    s += '<polyline class="route" points="'+done.map(d=>d.x.toFixed(1)+','+d.y.toFixed(1)).join(' ')+'"/>';
  }
  /* ピンを離しても文字幅までは吸収できないので、
     ラベルは上下4段の候補から先に置いた箱と当たらない位置を選ぶ */
  /* ピン自体も障害物。これが無いとラベルが数字の下に潜る */
  const boxes = pts.map(p => ({x1:p.x-17, x2:p.x+17, y1:p.y-17, y2:p.y+17}));
  const slot = p => {
    const w = Math.min(p.name.length,8)*8.4;
    for(const dy of [29,-21,41,-33,53,-45,65,-57]){
      const b = {x1:p.x-w/2, x2:p.x+w/2, y1:p.y+dy-7, y2:p.y+dy+4};
      if(!boxes.some(o => b.x1<o.x2 && b.x2>o.x1 && b.y1<o.y2 && b.y2>o.y1)){
        boxes.push(b); return p.y+dy;
      }
    }
    return null;   /* 置き場所が無ければ描かない。名前はリストと吹き出しにある */
  };
  pts.forEach(p=>{
    const on = dayDone().includes(p.id), ly = slot(p);
    s += '<g class="pin'+(on?' done':'')+'" data-id="'+p.id+'">'
       +   '<title>'+esc(p.name)+' / '+p.wait+'分待ち</title>'
       +   '<circle class="dot" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="15" fill="'+color(p.wait)+'"/>'
       +   '<text x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'">'+p.wait+'</text>'
       +   (ly===null ? '' :
           '<text class="nm" x="'+p.x.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle">'+esc(p.name.slice(0,8))+'</text>')
       + '</g>';
  });
  /* 撮った写真をその場所のピンに刺す（ride-log と同じ考え方） */
  pts.forEach(p=>{
    const ms = mediaOf(S.viewDay, p.id);
    if(!ms.length) return;
    const im = ms.find(m=>m.kind==='image');
    const cx = (p.x+15).toFixed(1), cy = (p.y-15).toFixed(1), r = 12, cid = 'cp'+p.id.slice(0,8);
    s += '<g class="pth" data-id="'+p.id+'">'
      + (im
        ? '<clipPath id="'+cid+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'"/></clipPath>'
          + '<image href="'+urlOf(im)+'" x="'+(cx-r)+'" y="'+(cy-r)+'" width="'+(r*2)+'" height="'+(r*2)+'" '
          + 'clip-path="url(#'+cid+')" preserveAspectRatio="xMidYMid slice"/>'
        : '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#2B2118"/>'
          + '<text class="mbadge" x="'+cx+'" y="'+cy+'">▶</text>')
      + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#fff" stroke-width="2.5"/>'
      + (ms.length>1 ? '<text class="mcnt" x="'+cx+'" y="'+(+cy+r+9)+'">'+ms.length+'</text>' : '')
      + '</g>';
  });

  const vp = document.getElementById('vp');
  vp.innerHTML = s;
  vp.querySelectorAll('.pth').forEach(g => g.onclick = e => {
    e.stopPropagation();
    if(dragged) return;
    const ms = mediaOf(S.viewDay, g.dataset.id);
    if(ms.length) openViewer(ms, 0);
  });
  vp.querySelectorAll('.pin').forEach(g => g.onclick = () => { if(!dragged) openInfo(g.dataset.id); });
}

/* ── ズーム／パン。viewBox ではなく g の transform を動かす ── */
let Z = {k:1, x:0, y:0}, dragged = false;
const applyZ = () => document.getElementById('vp')
  .setAttribute('transform','translate('+Z.x+' '+Z.y+') scale('+Z.k+')');
function zoomAt(cx, cy, mul){
  const k = Math.min(5, Math.max(1, Z.k*mul));
  const f = k/Z.k;
  Z.x = cx - (cx-Z.x)*f;  Z.y = cy - (cy-Z.y)*f;  Z.k = k;
  clampZ(); applyZ();
}
/* 引ききった時に地図が枠から離れないよう戻す */
function clampZ(){
  const lim = (Z.k-1);
  Z.x = Math.min(0, Math.max(-560*lim, Z.x));
  Z.y = Math.min(0, Math.max(-600*lim, Z.y));
}
function svgPt(e){
  const r = document.getElementById('map').getBoundingClientRect();
  return [(e.clientX-r.left)/r.width*560, (e.clientY-r.top)/r.height*600];
}
(function bindZoom(){
  const m = document.getElementById('map');
  m.addEventListener('wheel', e => {
    e.preventDefault();
    const [x,y] = svgPt(e);
    zoomAt(x, y, e.deltaY < 0 ? 1.18 : 1/1.18);
  }, {passive:false});

  const ptr = new Map();
  let last = null, pinch = 0;
  m.addEventListener('pointerdown', e => {
    ptr.set(e.pointerId, e); dragged = false;
    if(ptr.size===1){ last = svgPt(e); m.setPointerCapture(e.pointerId); }
  });
  m.addEventListener('pointermove', e => {
    if(!ptr.has(e.pointerId)) return;
    ptr.set(e.pointerId, e);
    const ps = [...ptr.values()];
    if(ps.length >= 2){
      const d = Math.hypot(ps[0].clientX-ps[1].clientX, ps[0].clientY-ps[1].clientY);
      if(pinch){
        const [x,y] = svgPt({clientX:(ps[0].clientX+ps[1].clientX)/2, clientY:(ps[0].clientY+ps[1].clientY)/2});
        zoomAt(x, y, d/pinch);
      }
      pinch = d; dragged = true;
    }else if(last){
      const p = svgPt(e);
      if(Math.hypot(p[0]-last[0], p[1]-last[1]) > 3) dragged = true;
      Z.x += p[0]-last[0]; Z.y += p[1]-last[1];
      last = p; clampZ(); applyZ();
    }
  });
  const up = e => { ptr.delete(e.pointerId); if(ptr.size<2) pinch = 0; if(!ptr.size) last = null; };
  m.addEventListener('pointerup', up);
  m.addEventListener('pointercancel', up);

  document.getElementById('zi').onclick = () => zoomAt(280, 300, 1.5);
  document.getElementById('zo').onclick = () => zoomAt(280, 300, 1/1.5);
  document.getElementById('zr').onclick = () => { Z = {k:1,x:0,y:0}; applyZ(); };
})();

function toggle(id){
  if(S.viewDay !== today()){          /* 過去の日を見ている時は書き換えない */
    S.viewDay = today(); render(); return;
  }
  const i = S.log.indexOf(id);
  if(i>=0) S.log.splice(i,1);
  else{
    S.log.push(id);
    const a = S.data.find(x=>x.id===id);
    if(a){
      S.hist.names[id] = a.name;      /* APIから消えた後も通算に名前を残す */
      (S.hist.waits[today()] ||= {})[id] = a.wait;
    }
  }
  save(); render();
}

function dayStrip(){
  const days = Object.keys(S.hist.days).filter(d => S.hist.days[d].length).sort().reverse();
  if(!days.includes(today())) days.unshift(today());
  document.getElementById('ds').innerHTML = days.map(d=>{
    const n = dayIds(d).length, ph = S.media.filter(m=>m.day===d).length;
    return '<button class="day'+(d===S.viewDay?' on':'')+'" data-d="'+d+'">'
      + '<b>'+fmtDay(d)+'</b><span>'+n+'台'+(ph?' / 📷'+ph:'')+'</span></button>';

    S.viewDay = b.dataset.d; render();

}

/* ── 写真・動画を足す ── */
let pickFor = null;
function addMedia(id){
  if(S.viewDay !== today()){ alert('写真を足せるのは今日の記録だけです'); return; }
  pickFor = id;
  document.getElementById('pick').click();
}
document.getElementById('pick').onchange = async function(){
  if(!pickFor || !this.files.length) return;
  const a = S.data.find(x=>x.id===pickFor);
  for(const f of this.files){
    await mediaPut({
      k: pickFor + '_' + f.name + '_' + f.size + '_' + f.lastModified,
      day: today(), ride: pickFor, name: a ? a.name : '',
      kind: f.type.startsWith('video') ? 'video' : 'image',
      blob: f
    });
  }
  this.value = ''; pickFor = null;
  S.media = await mediaAll();
  render();
};

/* ── 拡大ビューア ── */
function openViewer(list, i){
  const vw = document.getElementById('vw'), box = document.getElementById('vwin');
  const draw = n => {
    const m = list[n = (n+list.length)%list.length];
    box.innerHTML = (m.kind==='video'
        ? '<video src="'+urlOf(m)+'" controls playsinline autoplay></video>'
        : '<img src="'+urlOf(m)+'" alt="">')
      + '<div class="vw-b"><b>'+esc(m.name||'')+'</b>'
      +   '<span>'+fmtDay(m.day)+'　'+(n+1)+' / '+list.length+'</span>'
      +   '<button class="vw-del" data-k="'+m.k+'">削除</button></div>'
      + (list.length>1 ? '<button class="vw-n vw-p" data-n="'+(n-1)+'">‹</button>'
                       + '<button class="vw-n vw-x" data-n="'+(n+1)+'">›</button>' : '');
    box.querySelectorAll('.vw-n').forEach(b => b.onclick = e => { e.stopPropagation(); draw(+b.dataset.n); });
    box.querySelector('.vw-del').onclick = async e => {
      e.stopPropagation();
      if(!confirm('この1件を削除します。よろしいですか？')) return;
      await mediaDel(m.k); S.media = await mediaAll(); vw.hidden = true; render();
    };
  };
  draw(i); vw.hidden = false;
  vw.onclick = e => { if(e.target === vw) vw.hidden = true; };
}

    + '<div class="acts">'

/* ── ルート計画。URLに載せて他の人に渡せる ── */
const planToggle = id => {
  const i = S.plan.indexOf(id);
  if(i>=0) S.plan.splice(i,1); else S.plan.push(id);
  render();
};
const planMove = (i, d) => {
  const j = i+d;
  if(j<0 || j>=S.plan.length) return;
  [S.plan[i], S.plan[j]] = [S.plan[j], S.plan[i]];
  render();
};
/* UUIDは長いので先頭8文字だけ載せ、開いた側で前方一致で戻す */
const planUrl = () => location.origin + location.pathname
  + '#p=' + S.plan.map(id => id.slice(0,8)).join('.');

function planPane(){
  const el = document.getElementById('p-plan');
  const items = S.plan.map(id => S.data.find(x=>x.id===id)).filter(Boolean);
  let html = '<p class="lead">乗りたい順に選ぶと、地図にその順路が出ます。'
    + 'できたリンクを送れば、相手の画面にも同じ順路が出ます。</p>';

  if(items.length){
    const wait = items.reduce((a,b)=>a+(b.wait||0),0);
    let dist = 0;
    for(let i=1;i<items.length;i++) dist += meters(items[i-1], items[i]);
    html += '<div class="stats"><div class="st"><div class="k">WAIT (今の待ちで試算)</div>'
      +   '<div class="v dsp num">'+wait+'<em>分</em></div></div>'
      +   '<div class="st"><div class="k">WALK</div><div class="v dsp num">'+(dist/1000).toFixed(2)+'<em>km</em></div></div></div>'
      + '<ol class="plan">' + items.map((x,i)=>
          '<li><b class="dsp num">'+(i+1)+'</b><span>'+esc(x.name)
          + '<small class="num">'+(x.wait!=null?x.wait+'分待ち':'休止中')+'</small></span>'
          + '<button class="mv" data-i="'+i+'" data-d="-1" aria-label="上へ">↑</button>'
          + '<button class="mv" data-i="'+i+'" data-d="1" aria-label="下へ">↓</button>'
          + '<button class="mv rm" data-x="'+x.id+'" aria-label="外す">×</button></li>').join('')
      + '</ol>'
      + '<div class="acts"><button class="act big" id="p-share">🔗 このプランを共有</button>'
      + '<button class="act" id="p-clear">全部消す</button></div>';
  }else{
    html += '<div class="empty">まだ何も入っていません。<br>下のリストの <b>🗺</b> か、地図のピンから追加できます。</div>';
  }

  html += '<h2 class="sec">アトラクションから選ぶ</h2><div class="pick2">'
    + S.data.filter(x=>x.open).map(x =>
        '<button class="pk'+(S.plan.includes(x.id)?' on':'')+'" data-p="'+x.id+'">'
        + '<i>'+info(x.name).e+'</i>'+esc(x.name)+'</button>').join('')
    + '</div>';

  el.innerHTML = html;
  el.querySelectorAll('.mv').forEach(b => b.onclick = () =>
    b.dataset.x ? planToggle(b.dataset.x) : planMove(+b.dataset.i, +b.dataset.d));
  el.querySelectorAll('.pk').forEach(b => b.onclick = () => planToggle(b.dataset.p));
  const cl = document.getElementById('p-clear');
  if(cl) cl.onclick = () => { S.plan = []; render(); };
  const sh = document.getElementById('p-share');
  if(sh) sh.onclick = async () => {
    const url = planUrl(), text = 'USJの回り方（' + items.map(x=>x.name).join(' → ') + '）';
    try{
      if(navigator.share) await navigator.share({title:'パークログ USJ', text, url});
      else { await navigator.clipboard.writeText(url); sh.textContent = '✓ リンクをコピーしました'; }
    }catch(e){}
  };
}

      '<div class="stats">'
      + '<div class="st hero"><div class="k">'+(D===today()?'TODAY':fmtDay(D))+'</div><div class="v dsp num">'+items.length+'<em>アトラクション制覇</em></div></div>'
      + '<div class="st"><div class="k">TOTAL WAIT</div><div class="v dsp num">'+wait+'<em>分 並んだ</em></div></div>'
      + '<div class="st"><div class="k">DISTANCE</div><div class="v dsp num">'+(dist/1000).toFixed(2)+'<em>km 歩いた</em></div></div>'
      + '</div>'
      + '<ol class="tl">' + items.map(x=>{
          const w = waitOf(D,x.id) ?? x.wait, ms = mediaOf(D,x.id);
          return '<li><div class="tl-h"><span>'+esc(x.name)+'<small class="num">'+(w!=null?w+'分待ち':'—')+'</small></span>'
            + '<button class="cam" data-id="'+x.id+'">📷</button></div>'
            + (ms.length ? '<div class="film">' + ms.map(m =>
                '<button class="th sm" data-d="'+D+'" data-k="'+m.k+'">'
                + (m.kind==='video' ? '<video src="'+urlOf(m)+'" muted></video><i>▶</i>'
                                    : '<img src="'+urlOf(m)+'" alt="" loading="lazy">')
                + '</button>').join('') + '</div>' : '')
            + '</li>';
        }).join('')
      + '</ol>'
      + (D===today() ? '<button class="danger" id="cr">今日の記録をリセット</button>' : '');
  }

  /* ── 通算（公式に無いところ。ここが積み上がるほど戻ってくる理由になる） ── */
  const ever = new Set(Object.values(S.hist.days).flat());
  const rides = Object.values(S.hist.days).reduce((a,b)=>a+b.length,0);
  const visits = Object.values(S.hist.days).filter(d=>d.length).length;
  if(S.data.length && ever.size){
    const total = S.data.length;
    const pct = Math.round(ever.size/total*100);
    const yet = S.data.filter(x=>!ever.has(x.id));
    html += '<h2 class="sec">通算記録</h2>'
      + '<div class="rate">'
      +   '<div class="rate-h"><b>制覇率</b><span class="dsp num">'+pct+'<i>%</i></span></div>'
      +   '<div class="bar"><span style="width:'+pct+'%"></span></div>'
      +   '<div class="rate-f num">'+ever.size+' / '+total+' アトラクション　・　通算 '+rides+' 回　・　'+visits+' 日来園</div>'
      + '</div>';
    if(yet.length){
      html += '<div class="yet"><b>まだ乗っていない '+yet.length+' 件</b><div class="tags">'
        + yet.map(x=>'<span class="tag">'+esc(x.name)+'</span>').join('') + '</div></div>';
    }else{
      html += '<div class="yet"><b>全アトラクション制覇。もう乗るものがありません。</b></div>';
    }
  }

  el.innerHTML = html;
  el.querySelectorAll('.cam').forEach(b => b.onclick = () => addMedia(b.dataset.id));
  el.querySelectorAll('.th').forEach(b => b.onclick = () => {
    const ms = S.media.filter(m=>m.day===b.dataset.d);
    openViewer(ms, ms.findIndex(m=>m.k===b.dataset.k));
  });
  const cr = document.getElementById('cr');
  if(cr) cr.onclick = () => {
    if(confirm('今日の記録を全部消します。通算記録は残ります。')){ S.log.length = 0; save(); render(); }
  };
}

/* ── 天気（Open-Meteo・キー不要・CORS可） ── */
const WXI = {0:'☀️',1:'🌤',2:'⛅️',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌦',55:'🌦',
  61:'🌧',63:'🌧',65:'🌧',66:'🌧',67:'🌧',71:'🌨',73:'🌨',75:'🌨',77:'🌨',
  80:'🌦',81:'🌧',82:'🌧',85:'🌨',86:'🌨',95:'⛈',96:'⛈',99:'⛈'};
async function weather(){
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.6655&longitude=135.4323'
      + '&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code,precipitation_probability'
      + '&forecast_days=1&timezone=Asia%2FTokyo').then(r=>r.json());
    document.getElementById('wxi').textContent = WXI[r.current.weather_code] || '·';
    document.getElementById('wxt').textContent = Math.round(r.current.temperature_2m) + '°';
    const h = r.hourly, now = new Date().getHours();
    const rows = h.time.map((t,i)=>({h:+t.slice(11,13), i}))
      .filter(x => x.h >= now && x.h <= 21).slice(0,9);
    document.getElementById('wxb').innerHTML = rows.map(({h:hh,i}) =>
      '<div class="wxh"><span>'+hh+'時</span><b>'+(WXI[h.weather_code[i]]||'·')+'</b>'
      + '<em class="num">'+Math.round(h.temperature_2m[i])+'°</em>'
      + '<i class="num">'+h.precipitation_probability[i]+'%</i></div>').join('');
  }catch(e){
    document.getElementById('wxb').innerHTML = '<p class="note-s">天気を取得できませんでした</p>';
  }
}
(function wxUI(){
  const s = document.getElementById('wxs');
  document.getElementById('wx').onclick = () => s.hidden = false;
  document.getElementById('wxx').onclick = () => s.hidden = true;
  s.onclick = e => { if(e.target === s) s.hidden = true; };
})();
weather();
